name: Deploy Resume Engine Server

on:
  push:
    branches:
      - bittu
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Repository Files to Remote Server
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            --exclude=".git" \
            --exclude=".venv" \
            --exclude="__pycache__" \
            --exclude="scratch" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/resume-engine/ || true

      - name: Install Dependencies on Remote Server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "/opt/resume-engine/.venv/bin/pip install --upgrade pip && /opt/resume-engine/.venv/bin/pip install -r /opt/resume-engine/requirements.txt && /opt/resume-engine/.venv/bin/pip install -e /opt/resume-engine/" || true

      - name: Restart Service and Reload Caddy
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "systemctl restart resume-engine && systemctl reload caddy && systemctl status resume-engine --no-pager" || true

      - name: Verify Health Endpoint
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -f http://127.0.0.1:8000/api/v1/health"
