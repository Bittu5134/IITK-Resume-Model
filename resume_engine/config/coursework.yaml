  # Mathematics
  - code: "MTH101"
    name: "Mathematics I (Calculus)"
    aliases: ["mth101", "mth 101", "calculus", "mathematics i"]
    competencies: ["mathematics"]
    
  - code: "MTH102"
    name: "Mathematics II (Linear Algebra)"
    aliases: ["mth102", "mth 102", "linear algebra", "mathematics ii"]
    competencies: ["mathematics", "probability"]
    
  - code: "ESO207"
    name: "Data Structures and Algorithms"
    aliases: ["eso207", "eso 207"]
    competencies: ["algorithms"]
    
  # Physics
  - code: "PHY103"
    name: "Physics I"
    aliases: ["phy103", "phy 103", "physics i"]
    competencies: ["technical_depth"]
    
  - code: "PHY102"
    name: "Physics II"
    aliases: ["phy102", "phy 102", "physics ii"]
    competencies: ["technical_depth"]
    
  # Electronics
  - code: "ESC201"
    name: "Introduction to Electronics"
    aliases: ["esc201", "esc 201", "intro to electronics"]
    competencies: ["core_tools", "technical_depth"]

